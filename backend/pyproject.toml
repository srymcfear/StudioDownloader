[project]
name = "youtube-downloader-backend"
version = "1.0.0"
description = "High-Quality YouTube Video and Audio Downloader API (4K/8K, 320kbps MP3/Lossless)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "yt-dlp>=2024.8.0",
    "imageio-ffmpeg>=0.5.1",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "curl-cffi>=0.16.1",
    "pycryptodomex>=3.23.0",
    "brotli>=1.2.0",
    "mutagen>=1.48.1",
    "websockets>=17.0.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
